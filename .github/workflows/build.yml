name: Build QExt2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GPR_USER: QbotMS
      GPR_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      QBOT_BEARER: ${{ secrets.QBOT_BEARER }}
      QEXT_GATE_TOKEN: ${{ secrets.QEXT_GATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo "::group::Auth check"
          echo "User set: $([ -n \"$GPR_USER\" ] && echo YES || echo NO)"
          echo "Token set: $([ -n \"$GPR_TOKEN\" ] && echo YES || echo NO)"
          echo "Token starts with: ${GPR_TOKEN:0:4}..."
          echo "::endgroup::"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: QExt2-test-reports
          path: app/build/reports/tests/
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QExt2-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QExt2-debug
      - uses: softprops/action-gh-release@v2
        with:
          name: QExt2 Auto Build
          tag_name: build-${{ github.run_number }}
          files: app-debug.apk
          prerelease: false
          generate_release_notes: true
