name: Build QExt2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write config
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "QEXT_GATE_TOKEN=placeholder" >> local.properties
          echo "QEXT_READINESS_URL=https://qbot.cytr.us/ride-readiness" >> local.properties
          echo "QEXT_GATE_URL=https://qbot.cytr.us/gate/open" >> local.properties
          echo "OPENWEATHER_API_KEY=placeholder" >> local.properties
          echo "OPENWEATHER_BASE_URL=https://api.openweathermap.org/data/2.5/weather" >> local.properties

      - name: Build APK
        run: ANDROID_HOME=/usr/local/lib/android/sdk ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QExt2-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QExt2-debug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: QExt2 Auto Build
          tag_name: build-${{ github.run_number }}
          files: app-debug.apk
          prerelease: true
          generate_release_notes: true
