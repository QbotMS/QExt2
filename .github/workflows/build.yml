name: Build QExt2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GPR_USER: QbotMS
      GPR_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      QBOT_BEARER: ${{ secrets.QBOT_BEARER }}
      QEXT_GATE_TOKEN: ${{ secrets.QEXT_GATE_TOKEN }}
      # E3 (plan v2): token /ride-readiness i prywatny klucz release (sekrety repo; bez nich build testowy na kluczu debug)
      QEXT_READINESS_TOKEN: ${{ secrets.QEXT_READINESS_TOKEN }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      # jedno haslo dla magazynu i klucza; alias nie jest tajny
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
      RELEASE_KEY_ALIAS: qext2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Klucz release z sekretu (E3.1)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qext2-release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/qext2-release.jks" >> "$GITHUB_ENV"
            echo "Podpis: klucz release"
          else
            echo "::warning::Brak RELEASE_KEYSTORE_B64 -- APK podpisany kluczem debug"
          fi
      - run: |
          echo "::group::Auth check"
          echo "User set: $([ -n \"$GPR_USER\" ] && echo YES || echo NO)"
          echo "Token set: $([ -n \"$GPR_TOKEN\" ] && echo YES || echo NO)"
          echo "Token starts with: ${GPR_TOKEN:0:4}..."
          echo "::endgroup::"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee gradle_test_output.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: QExt2-test-output
          path: |
            gradle_test_output.log
            app/build/reports/tests/
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QExt2-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QExt2-release
      - uses: softprops/action-gh-release@v2
        with:
          name: QExt2 Auto Build
          tag_name: build-${{ github.run_number }}
          files: app-release.apk
          prerelease: false
          generate_release_notes: true
