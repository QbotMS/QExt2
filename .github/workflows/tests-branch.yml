name: Testy (galezie fix)

on:
  push:
    branches: ['fix/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GPR_USER: QbotMS
      GPR_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Testy jednostkowe (bledy jako adnotacje -- czytelne bez tokenu)
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest 2>&1 | tee gradle_out.log; then
            grep -E "^e: |FAILED|AssertionError|Exception|expected:" gradle_out.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
